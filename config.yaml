risk_management:
  risk_pct_per_trade: 0.02
  max_risk_dollars: 10.00
  max_trades_per_day: 1
  enable_chop_stop: false      # Disabled: 2-year backtest proved letting trades run doubled +3R targets from 28 to 60
  time_stop_minutes: 0         # Disabled when enable_chop_stop is false
  chop_progress_threshold: 0.3
  ratchet_1_5r: true           # Ratchet stop to Breakeven at +1.5R

execution:
  environment: "prod" 
  trading_windows:
    - start: "10:00"
      end: "13:30"
  morning_cutoff: "10:45"
  midday_max_unit_pct: 0.0075  # 0.75% max (Entry - LOD) distance for afternoon setups
  min_close_pct: 0.60          # Bullish close filter: upper 40% of 1m candle
  min_vol_ratio: 0.80          # Volume check: >= 0.8x 10-bar SMA

universe:
  mode: "curated"  # "curated" or "sp500"
  curated_tickers:
    - "CONL"   # 2x Long Coinbase ETF (Top Performer: 3.03 PF)
    - "SOXL"   # 3x Semiconductor Bull (2.16 PF)
    - "TQQQ"   # 3x Nasdaq-100 Bull (1.66 PF)
    - "PLTR"   # High Momentum Sweet Spot (1.97 PF)
    - "RBLX"   # High Momentum Sweet Spot (1.90 PF)
    - "AMZN"   # Mega-Cap Cloud Trend (2.00 PF)
    - "AAPL"   # Mega-Cap Quality (1.32 PF)
    - "ARM"    # High-Beta Tech (1.33 PF)
    - "GOOGL"  # Mega-Cap Quality
  require_daily_sma_pullback: true
  sma_tolerance_pct: 0.03

market_gate:
  enabled: true
  index_ticker: "SPY"
  regime_ticker: "QQQ"
  daily_ema_period: 50
  require_intraday_vwap_alignment: true
  enable_inverses_in_bear: true
  inverse_tickers:
    - "PSQ"
  bear_blacklist:
    - "ARM"
    - "CONL"
    - "SOXL"
  require_relative_strength: false



