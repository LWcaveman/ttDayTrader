risk_management:
  risk_pct_per_trade: 0.02
  max_risk_dollars: 20.00
  max_trades_per_day: 1        # Option B: 1 high-conviction trade per day (55.4% Win Rate, 100% GFV-safe overnight settlement)
  enable_chop_stop: false      # Disabled: 2-year backtest proved letting trades run doubled +3R targets from 28 to 60
  time_stop_minutes: 0         # Disabled when enable_chop_stop is false
  chop_progress_threshold: 0.3
  ratchet_1_5r: true           # Ratchet stop to Breakeven at +1.5R
  enable_partial_scale: true   # Route 1: Scale out 33% at +1.5R, ratchet stop to Breakeven, runner to +4.0R
  partial_scale_r: 1.5         # +1.5R partial profit target
  partial_scale_pct: 0.33      # Scale 33% of position
  runner_r: 4.0                # +4.0R runner target for remaining 67%

execution:
  environment: "prod" 
  trading_windows:
    - start: "10:00"
      end: "10:45"
  morning_cutoff: "10:45"
  midday_max_unit_pct: 0.0075  # 0.75% max (Entry - LOD) distance for afternoon setups
  min_close_pct: 0.60          # Bullish close filter: upper 40% of 1m candle
  min_vol_ratio: 0.80          # Volume check: >= 0.8x 10-bar SMA

regime_routing:
  enabled: true                # Bull (QQQ > 50 EMA) -> Late Entry Momentum; Bear (QQQ <= 50 EMA) -> Morning VWAP Reclaim

universe:
  mode: "curated"  # "curated" or "sp500"
  curated_tickers:
    - "TSLL"   # 2x Long Tesla ETF (Elite High Beta)
    - "NVDL"   # 2x Long NVDA ETF (Elite High Beta)
    - "CONL"   # 2x Long Coinbase ETF (Top Performer: 3.03 PF)
    - "TQQQ"   # 3x Nasdaq-100 Bull ETF (1.66 PF)
    - "PLTR"   # High Momentum Sweet Spot (1.97 PF)
    - "RBLX"   # High Momentum Sweet Spot (1.90 PF)
    - "AAPL"   # Mega-Cap Quality (1.32 PF)
    - "AMZN"   # Mega-Cap Cloud Trend (2.00 PF)
  reclaim_tickers:
    - "CONL"   # High-Beta Sweeper (Crypto Beta)
    - "SOFI"   # High-Beta Sweeper (Fintech Beta)
    - "MARA"   # High-Beta Sweeper (Mining Beta)
    - "PLTR"   # High-Beta Sweeper (AI Growth Beta)
  require_daily_sma_pullback: true
  sma_tolerance_pct: 0.03

vwap_reclaim:
  enabled: true
  start_time: "09:40"
  end_time: "10:15"
  min_sweep_bars: 2
  min_depth_pct: 0.003
  max_depth_pct: 0.025
  min_close_pct: 0.60
  min_vol_ratio: 0.80
  min_stop_pct: 0.006
  max_stop_pct: 0.025

market_gate:
  enabled: true
  index_ticker: "SPY"
  regime_ticker: "QQQ"
  daily_ema_period: 50
  require_intraday_vwap_alignment: true
  enable_inverses_in_bear: true
  inverse_tickers:
    - "PSQ"
  bear_blacklist:
    - "TSLL"
    - "NVDL"
    - "CONL"
  require_relative_strength: false

midday_reversion:
  enabled: true
  start_time: "11:30"
  end_time: "13:30"
  sd_mult: 2.5
  adx_max: 25.0
  vol_exhaustion: true
  target_type: "hybrid_vwap"
  partial_pct: 0.50
  hammer_wick_pct: 0.40
  min_stop_pct: 0.005
  max_stop_pct: 0.025
  tickers:
    - "CONL"
    - "NVDL"
    - "TQQQ"
    - "SOXL"
    - "UPRO"
    - "BITX"
